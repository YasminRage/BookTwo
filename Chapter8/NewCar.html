}
#carbody::before {
    content: "";
    position: absolute;
    width: 120px;
    height: 50px;
    background-color: lightblue;
    top: -20px;
    left: 90px;
    border-radius: 10px 10px 0 0;
}

/* Front Wheel */
#frontwheel, #backwheel {
    position: absolute;
    width: 50px;
    height: 50px;
    background-color: black;
    border-radius: 50%;

}

/* Back Wheel */
#backwheel {
    bottom: -25px;
    left: 30px;
}

#frontwheel {
    bottom: -25px;
    right: 30px;
}
